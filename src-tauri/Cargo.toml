[package]
name = "record-assistant"
version = "0.3.1"
description = "项目、关系与事件的本地记录助手"
authors = ["Yihe Huang"]
edition = "2021"

[lib]
name = "record_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
